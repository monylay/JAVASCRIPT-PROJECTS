<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <p id="Math">2 + 2 =</p> <!--adding operator-->
    <button id="myBtn">Add</button>

    <p id="Sub">5 - 3 =</p> <!-- subtracting-->
    <button id="Clicker">Subtract</button>

    <p id="Multi">4 * 2 =</p> <!-- multiplying-->
    <button id="Touch">Multiply</button>

    <p id="Div">10 / 2 =</p> <!--dividing-->
    <button id="But">Divide</button>

    <p id="oper">(1 + 2) * 10 / 2 - 5</p> <!--Multiple Operations-->
    <button id="here">Operations</button>

    <p id="mod"></p> <!--Modulus-->
    <button onclick="modulus_Operator()">Modulus</button>

    <p id="neg">10</p> <!--Negation-->
    <button id="negation">Negative</button>

    <p id="count">0</p><!-- increase or decrease counting-->
    <button id="increase">+</button>
    <button id="decrease">-</button>

    <p id="result"></p> <!--Random Number generator-->
    <button onclick="showRandom()">Random Number</button>
    <script src="JS/main.js"></script>
</body>

</html>
